name: CI | Test cyberia-hardhat

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile, test and audit
    # A branch of this repository runs on push; a pull request runs here only from a fork.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The production dependencies ship on-chain: a moderate advisory fails the run.
      - name: Audit the production dependencies
        run: npm audit --audit-level=moderate --omit=dev

      # The toolchain carries advisories upstream has not fixed: report them, do not fail.
      - name: Audit the toolchain dependencies
        run: npm audit --audit-level=moderate || true

      - name: Compile the contracts
        run: npm run compile

      - name: Run the test suite
        run: npm test
        env:
          REPORT_GAS: 'true'

      - name: Measure the Solidity coverage
        run: npm run coverage
